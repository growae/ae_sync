[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log

[program:postgresql]
command=/usr/lib/postgresql/16/bin/postgres -D /data/postgres
user=postgres
autorestart=true
priority=10
stdout_logfile=/var/log/postgresql.log
stderr_logfile=/var/log/postgresql-error.log

[program:ae_mdw]
command=/home/aeternity/ae_mdw/bin/ae_mdw start
environment=AETERNITY_CONFIG="/home/aeternity/aeternity.yaml",AE__CHAIN__PERSIST=true,AE__CHAIN__DB_PATH="/data/mnesia"
autorestart=true
priority=20
startsecs=10
stdout_logfile=/var/log/ae_mdw.log
stderr_logfile=/var/log/ae_mdw-error.log

[program:aesync]
command=node /app/dist/esm/bin/aesync.js start
environment=DATABASE_URL="postgresql://aesync:aesync@localhost:5432/aesync",AE_MDW_URL="http://localhost:4000"
autorestart=true
priority=30
startsecs=10
startretries=5
stdout_logfile=/var/log/aesync.log
stderr_logfile=/var/log/aesync-error.log

[program:healthcheck_wait]
command=/bin/bash -c "until curl -sf http://localhost:4000/v3/status; do sleep 5; done && supervisorctl start aesync"
autorestart=false
startsecs=0
priority=25
stdout_logfile=/var/log/healthcheck_wait.log
stderr_logfile=/var/log/healthcheck_wait-error.log

[group:aesync]
programs=postgresql,ae_mdw,healthcheck_wait,aesync
